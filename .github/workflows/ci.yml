name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Uma versão quebrada não cancela as outras: o resultado de cada uma
      # precisa aparecer.
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Instalar dependências
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Testes (pytest)
        run: pytest -q
